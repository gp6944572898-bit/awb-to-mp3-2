name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установить NDK и CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Скачать исходники vgmstream и LAME
        run: bash scripts/fetch-native.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Собрать APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Подготовить APK
        run: cp app/build/outputs/apk/debug/app-debug.apk awb2mp3.apk

      - uses: actions/upload-artifact@v4
        with:
          name: awb2mp3-apk
          path: awb2mp3.apk

      - name: Опубликовать APK в Releases (прямая ссылка для скачивания)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest awb2mp3.apk \
            --title "AWB to MP3 (последняя сборка)" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}" \
            --latest
